name: pip-audit

permissions:
  contents: read

on:
  schedule:
    # Runs every day at 01:23
    - cron: "23 1 * * *"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 #v9.0.0

    - name: Run pip-audit
      run: |
        # pip-audit installs requirements in a temporary env; pip hash-checking fails
        # on VCS requirements (like spy-ssz @ git+...). Exclude those entries
        # from the audit input: they are not published on PyPI anyway.
        # Exclude only our pinned spy-ssz VCS source from eth2353/spy-ssz.
        # If spy-ssz is sourced from a different owner/repo, keep it in audit input.
        grep -v 'spy-ssz @ git+https://github.com/eth2353/spy-ssz@' requirements.txt > requirements-pip-audit.txt
        uvx pip-audit -r requirements-pip-audit.txt --disable-pip

name: Beacon API Spec

permissions:
  contents: read

on:
  push:
    branches: [ "beacon-api-spec-tests" ]
  schedule:
    # Runs every 7 days at 02:34
    - cron: "34 2 */7 * *"
  workflow_dispatch:

jobs:
  beacon-api-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          activate-environment: true

      - name: Download latest stable Beacon API spec
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/ethereum/beacon-APIs/releases/latest/download/beacon-node-oapi.json \
            --output "${RUNNER_TEMP}/beacon-node-oapi.json"
          jq -r '"Beacon API: " + .info.version' "${RUNNER_TEMP}/beacon-node-oapi.json"
          sha256sum "${RUNNER_TEMP}/beacon-node-oapi.json"

      - name: Test Vero against the Beacon API spec
        run: |
          uv sync
          uv run pytest tests \
            --beacon-api-spec-path "${RUNNER_TEMP}/beacon-node-oapi.json"

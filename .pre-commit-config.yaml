default_language_version:
    python: python3.12

repos:
  # All files basic formatter
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-merge-conflict
      - id: check-yaml
        exclude: "docs/mkdocs.yml"
      - id: end-of-file-fixer
        exclude: "src/spec/configs/\\w+\\.yaml$"
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-format
      - id: ruff-check
        exclude: "scripts/.*\\.py$"
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
    -   id: mypy
        exclude: "scripts/.*\\.py$"
        additional_dependencies:
          [
          aiohttp==3.14.5,
          aiosignal==1.4.0,
          msgspec==0.22.0,
          prometheus-client==0.26.0,
          pytest==9.1.1,
          "spy-ssz @ git+https://github.com/eth2353/spy-ssz.git@612c3f73c54ff2a8cbc374f5c4af7b9d7aa24d00",
          types-PyYAML==6.0.12.20260906,
          ]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        args: ["--failure-threshold=warning"]

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.5
    hooks:
      - id: uv-lock
      - id: uv-export
        name: export dependencies -> requirements.txt
        args: ["--no-dev", "--output-file=requirements.txt"]
      - id: uv-export
        name: export dev dependencies -> requirements-dev.txt
        args: ["--dev", "--output-file=requirements-dev.txt"]
